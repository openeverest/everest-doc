name: Build OpenEverest Docs (1.x)

on:
  push:
    branches:
      - main
  pull_request:

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: '3.x'

      - name: Setup MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install wheel
          test -f requirements.txt && pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "GitHub Action"
          git config user.email "github-action@users.noreply.github.com"

      # Builds Material-themed static web site in 'preview' branch
      - name: Build a themed site
        run: |
          mike deploy 1.x -b preview
          mike set-default 1.x -b preview
          mike retitle 1.x "Everest 1.x (LATEST)" -b preview
