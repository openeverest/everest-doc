name: Build OpenEverest Docs (1.x)

on:
  push:
    branches:
      - main
  pull_request:

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.x'

      - name: Setup MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install wheel
          test -f requirements.txt && pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "GitHub Action"
          git config user.email "github-action@users.noreply.github.com"

      # Builds Material-themed static web site in 'preview' branch
      - name: Build a themed site
        run: |
          mike deploy 1.x -b preview
          mike set-default 1.x -b preview
          mike retitle 1.x "Everest 1.x (LATEST)" -b preview
